{{define "layout"}}<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{template "title" .}} · Готовность</title>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<link rel="stylesheet" href="/static/style.css">
<script>
// A risk's weight is in percentage points: base 30% and weight -10 give 20%.
function previewWeight(input){
  var out=input.closest('form').querySelector('.preview');
  var raw=input.value.split('−').join('-').split(',').join('.').split('%').join('').trim();
  var weight=parseFloat(raw);
  if(raw===''||isNaN(weight)){out.textContent='';return;}
  var base=parseFloat(input.dataset.base)*100;
  var next=Math.min(Math.max(base+weight,0),100);
  out.textContent='Если выполнить только это действие: '+base.toFixed(1)+'% → '+next.toFixed(1)+'%';
}
// Shows the fields of the chosen case kind; hidden inputs are disabled, so they are neither
// required nor sent.
function toggleKindFields(select){
  select.closest('form').querySelectorAll('[data-kind]').forEach(function(field){
    var shown=field.dataset.kind===select.value;
    field.hidden=!shown;
    field.querySelectorAll('input,textarea,select').forEach(function(input){input.disabled=!shown;});
  });
}
</script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><a href="/"><img src="/static/Sonae-Logo.png" alt="Sonae"></a></div>
    <form class="account" method="post" action="/logout">
      <span class="muted">Учётка: <strong>{{.Login}}</strong></span>
      <button class="mini">Выйти</button>
    </form>

    <section class="side-card">
      <h3>Профиль</h3>
      <div class="muted">Уходит в каждый промпт нейросети</div>
      <form hx-post="/profile" hx-target="#profile-status" hx-swap="innerHTML">
        {{with .Profile}}
        <label>Возраст <input name="age" value="{{.Age}}" inputmode="numeric" required></label>
        <label>Пол
          <select name="sex">
            <option value="">не указан</option>
            <option value="male" {{if eq .Sex "male"}}selected{{end}}>мужской</option>
            <option value="female" {{if eq .Sex "female"}}selected{{end}}>женский</option>
          </select>
        </label>
        <label>Страна <input name="country" value="{{.Country}}"></label>
        <label>Город <input name="city" value="{{.City}}"></label>
        <label>Профессия <input name="profession" value="{{.Profession}}"></label>
        <label>Семейное положение
          <select name="marital_status">
            <option value="">не указано</option>
            <option value="single" {{if eq .MaritalStatus "single"}}selected{{end}}>не в браке</option>
            <option value="in_relationship" {{if eq .MaritalStatus "in_relationship"}}selected{{end}}>в отношениях</option>
            <option value="married" {{if eq .MaritalStatus "married"}}selected{{end}}>в браке</option>
            <option value="divorced" {{if eq .MaritalStatus "divorced"}}selected{{end}}>в разводе</option>
            <option value="widowed" {{if eq .MaritalStatus "widowed"}}selected{{end}}>вдовец / вдова</option>
          </select>
        </label>
        <label>Дети
          <select name="children">
            <option value="">не указано</option>
            <option value="no" {{if eq .Children "no"}}selected{{end}}>нет</option>
            <option value="yes" {{if eq .Children "yes"}}selected{{end}}>есть</option>
          </select>
        </label>
        <label>Здоровье
          <textarea name="health" rows="3" placeholder="Хронические болезни, лекарства, аллергии, вредные привычки">{{.Health}}</textarea>
        </label>
        <label>О себе
          <textarea name="about" rows="3" placeholder="Всё, что ещё важно знать нейросети">{{.About}}</textarea>
        </label>
        {{end}}
        <div><button class="primary">Сохранить</button> <span id="profile-status"></span></div>
      </form>
    </section>
  </aside>
  <main>{{template "content" .}}</main>
</div>
</body>
</html>{{end}}

{{define "prompt-box"}}
<p class="muted">Промпт готов: скопируй и вставь в нейросеть.</p>
<textarea id="prompt-text" rows="12" readonly>{{.Prompt}}</textarea>
<p><button class="primary" type="button" onclick="navigator.clipboard.writeText(document.getElementById('prompt-text').value);this.textContent='Скопировано ✓'">Копировать</button></p>
{{end}}
